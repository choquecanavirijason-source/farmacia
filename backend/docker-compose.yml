services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmacia_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: farmacia
      DB_USERNAME: farmacia
      DB_PASSWORD: secret
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - farmacia_net

  db:
    image: mysql:8.0
    container_name: farmacia_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: farmacia
      MYSQL_USER: farmacia
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - farmacia_net

volumes:
  db_data:
  vendor_data:

networks:
  farmacia_net:
    driver: bridge
